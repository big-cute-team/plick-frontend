# 알림 규칙 (KAN-457). 1분마다 평가한다.
#
# 임계값은 prod 실측(2026-09-09, 수집 40시간)에서 출발한 초기값이다. 트래픽이 mobile
# 0.03 req/s·web 0.09 req/s로 낮아서 5분 창 비율은 요청 한 건만 실패해도 튄다. 그래서
# 창을 30분으로 넓히고 그 창에 요청이 20건 이상일 때만 비율을 본다. 며칠 더 보고 조정한다.
#
# `or ... * 0`: web은 아직 5xx 시리즈가 한 번도 안 생겨서 분자가 비어 있다. 비어 있으면
# 나눗셈 결과 자체가 없어 영원히 NoData가 된다. 분모의 라벨 집합에 0을 깔아 0%로 만든다.
apiVersion: 1
groups:
  - orgId: 1
    name: plick-frontend
    folder: PLick
    interval: 1m
    rules:
      - uid: plick-be-error-rate
        title: BE 호출 에러율
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.app }} BE 호출 에러율(5xx·0) {{ printf \"%.1f\" (mul $values.A.Value 100) }}% (30분 창, 20건 이상)"
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                (
                  sum by (app) (rate(plick_be_request_total{status=~"5..|0"}[30m]))
                  or sum by (app) (rate(plick_be_request_total[30m])) * 0
                )
                / sum by (app) (rate(plick_be_request_total[30m]))
                and sum by (app) (increase(plick_be_request_total[30m])) >= 20
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
      - uid: plick-target-down
        title: 스크레이프 타깃 down
        condition: C
        for: 3m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} {{ $labels.instance }} 가 3분째 안 긁힌다 (up=0). 앱이 죽었거나 메트릭 포트가 안 열렸다"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: up{job=~"plick-.*"} == 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gte, params: [0] }
