# 알림 수신처와 라우팅 (KAN-457). 슬랙 Incoming Webhook 하나로 다 보낸다.
#
# 웹훅 URL은 시크릿이라 파일에 적지 않는다. 그라파나는 프로비저닝 파일 안의 $VAR를
# 환경변수로 치환하므로 compose가 SLACK_WEBHOOK_URL을 넘기고, 그 값은 user data가
# SSM Parameter Store(/plick/frontend/monitoring/prod/slack-webhook)에서 읽어
# /srv/monitoring/.env에 써 둔 것이다. 리포에도 user data 스크립트에도 값이 남지 않는다.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: slack-plick-frontend
    receivers:
      - uid: slack-plick-frontend
        type: slack
        settings:
          url: $SLACK_WEBHOOK_URL
          title: "[PLick FE] {{ .CommonLabels.alertname }}"
          text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
        disableResolveMessage: false
policies:
  - orgId: 1
    receiver: slack-plick-frontend
    group_by: [alertname, app]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
