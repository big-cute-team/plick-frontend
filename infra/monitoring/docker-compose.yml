# 모니터링 EC2(prod VPC 프라이빗 서브넷) 한 대에서 도는 프로메테우스 + 그라파나 (KAN-455).
# 두 포트 모두 127.0.0.1에만 바인딩한다. 접근은 SSM 포트 포워딩으로만 하고, 보안그룹에도
# 인바운드가 없다. 인스턴스 안에서 localhost로 닿는 게 곧 포워딩 대상이다.
# 볼륨은 named volume이라 docker compose down 정도로는 지표가 안 지워진다.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    restart: unless-stopped
    # 그라파나만 사설 IP에 연다(grafana.plick.co.kr). 보안그룹이 prod 공개 ALB에서 오는 3000번만 받고,
    # ALB 리스너 규칙이 허용 IP만 넘긴다(plick-infra/observability/grafana_access.tf).
    # 127.0.0.1도 함께 열어 두어 SSM 포트 포워딩은 그대로 쓴다.
    ports:
      - "127.0.0.1:3000:3000"
      - "192.168.2.112:3000:3000"
    environment:
      GF_SERVER_ROOT_URL: https://grafana.plick.co.kr
      # 첫 로그인은 admin/admin, 로그인 직후 비밀번호 변경을 강제한다.
      # 바깥에서 닿을 수 없는 포트라 초기값을 user data에 박아 두지 않는다.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # 슬랙 웹훅 (KAN-457). 같은 폴더 .env에서 온다. user data가 SSM에서 읽어 쓴다.
      # 없으면 자리표시자로 두어 프로비저닝은 통과시키고 전송만 실패하게 한다 — 시크릿 하나
      # 때문에 그라파나 자체가 못 뜨면 안 된다.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/PLACEHOLDER}
      # 하트비트 웹훅 토큰 (KAN-601). user data가 SSM(/plick/frontend/monitoring/prod/heartbeat-token)에서
      # 읽어 .env에 쓴다. 비어 있어도 그라파나는 뜨고, 하트비트만 401로 거절된다
      HEARTBEAT_TOKEN: ${HEARTBEAT_TOKEN:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
