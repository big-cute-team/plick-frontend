version: 2
updates:
  # npm/pnpm 의존성 (루트 pnpm-lock.yaml이 워크스페이스 전체를 커버)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # minor/patch 업데이트는 한 PR로 묶어 노이즈 감소 (major는 개별 PR)
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions 워크플로에서 쓰는 액션 버전 업데이트
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
