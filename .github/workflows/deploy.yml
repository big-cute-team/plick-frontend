name: Deploy

# 브랜치-환경 매핑(KAN-377): develop 푸시는 dev 인프라로, main 푸시는 prod 인프라로
# 나간다. 매핑은 GitHub Environments(dev/prod)로 걸려 있어 API_BASE_URL 시크릿이
# 환경 단위로 갈리고, 사이트 URL·CodeDeploy 이름·버킷은 아래 job env의 분기 상수다.
# workflow_dispatch는 코드 변경 없이 다시 돌려야 할 때 쓴다. 실행 ref가 develop이면
# dev, main이면 prod로 간다. API_BASE_URL은 빌드 때 산출물에 박히는 값이라,
# BE 주소가 바뀌면 환경 시크릿만 고치고 여기서 재실행한다.
#
# v2(KAN-344): SSM Run Command 대신 CodeDeploy Blue/Green으로 나간다.
# 두 앱을 bundle.zip 하나로 묶어 배포 1건을 만든다. 인스턴스가 통째로 교체되는
# 구조라 앱별로 따로 배포하면 한 ASG를 두 배포가 서로 복제·종료하며 싸우기 때문이다.
# docs와 md만 바뀐 푸시는 배포를 건너뛴다. 산출물이 안 변하는데 인스턴스를
# 통째로 교체하는 낭비를 막는다. 코드가 섞인 푸시는 정상 트리거된다.
on:
  push:
    branches: [develop, main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# 배포는 중간에 끊기면 어중간한 상태로 남는다. 새 실행이 와도 취소하지 않고 줄 세운다.
# 그룹은 환경별이라 dev와 prod 배포는 서로를 기다리지 않는다.
concurrency:
  group: deploy-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  cancel-in-progress: false

# OIDC로 AWS 롤을 빌려 S3 업로드와 CodeDeploy 배포 생성을 한다.
# id-token: write가 OIDC 토큰 발급 권한이다. 이게 없으면 configure-aws-credentials가 실패한다.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy bundle
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    # 배포 버킷은 BE와 같이 쓰는 plick-deploy다. 프론트 몫 접두사가 frontend/이고
    # 그 아래를 환경별(dev/·prod/)로 갈라 키가 frontend/<env>/<sha>/bundle.zip이다.
    # 수명 주기 규칙과 OIDC 롤의 s3 권한이 frontend/* 기준이라 둘 다 그대로 덮는다.
    #
    # STATIC_BUCKET은 별개다(KAN-373). 배포 아티팩트는 CodeDeploy 에이전트만 읽고
    # 7일 뒤 지워지지만, 정적 자산은 CloudFront가 읽고 세대별로 오래 남아야 한다.
    # 수명 주기와 접근 주체가 달라서 버킷을 섞지 않고, 환경별로도 버킷을 가른다.
    #
    # 사이트 URL은 canonical·sitemap용 대표 URL이라 앱·환경마다 다르고(KAN-346),
    # 비밀이 아닌 공개 도메인이라 시크릿 대신 여기 분기 상수로 박는다. 값이 틀리면
    # canonical과 sitemap이 통째로 엉뚱한 도메인을 가리키므로 수정 시 재확인한다.
    env:
      AWS_REGION: ap-northeast-2
      DEPLOY_BUCKET: plick-deploy
      DEPLOY_PREFIX: frontend/${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      STATIC_BUCKET: ${{ github.ref_name == 'main' && 'plick-static-prod' || 'plick-static-dev' }}
      CODEDEPLOY_APP: ${{ github.ref_name == 'main' && 'plick-frontend-prod' || 'plick-frontend-dev' }}
      CODEDEPLOY_GROUP: ${{ github.ref_name == 'main' && 'plick-frontend-dg-prod' || 'plick-frontend-dg-dev' }}
      WEB_SITE_URL: ${{ github.ref_name == 'main' && 'https://plick.co.kr' || 'https://dev.plick.co.kr' }}
      MOBILE_SITE_URL: ${{ github.ref_name == 'main' && 'https://m.plick.co.kr' || 'https://dev-m.plick.co.kr' }}
      # GA4 측정 ID (KAN-380). 실서비스 빌드에만 넣는다 — dev 빌드는 빈 값이라
      # 태그가 렌더되지 않아 개발 트래픽이 실서비스 지표에 섞이지 않는다.
      # 브라우저에 그대로 노출되는 공개 값이라 시크릿이 아니다.
      GA_ID: ${{ github.ref_name == 'main' && 'G-BF3JX9EDYQ' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 러너(ubuntu x86_64)에서 빌드해야 한다. 산출물에는 sharp 같은 플랫폼 종속
      # 네이티브 바이너리가 딸려 들어가서, 맥에서 빌드한 걸 올리면 EC2에서 깨진다.
      # Launch Template AMI도 같은 이유로 x86_64에 맞춰져 있다.
      # 교차 URL(web의 MOBILE_SITE_URL, mobile의 WEB_SITE_URL)은 m-dot 상호 선언용
      # (모바일 canonical → 데스크톱, 데스크톱 alternate → 모바일)이다.
      - name: Build web
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ env.WEB_SITE_URL }}
          NEXT_PUBLIC_MOBILE_SITE_URL: ${{ env.MOBILE_SITE_URL }}
          NEXT_PUBLIC_GA_ID: ${{ env.GA_ID }}
        run: pnpm --filter web build

      - name: Build mobile
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ env.MOBILE_SITE_URL }}
          NEXT_PUBLIC_WEB_SITE_URL: ${{ env.WEB_SITE_URL }}
          NEXT_PUBLIC_GA_ID: ${{ env.GA_ID }}
        run: pnpm --filter mobile build

      # standalone은 public/과 .next/static/을 담지 않는다(CDN 배포 전제).
      # 한 서버에서 다 서빙하므로 여기서 채워 넣는다. 빠뜨리면 CSS·이미지가 404다.
      #
      # v3(KAN-373)에서 .next/static이 S3로도 올라가지만 이 복사는 남겨 둔다.
      # CloudFront 비헤이비어가 잘못 걸렸을 때 EC2가 폴백으로 서빙해 주는 안전핀이다.
      # 전환이 안정된 뒤에 제거를 판단한다(deploy-v3-cdn.md §16 14번).
      - name: Assemble standalone
        run: |
          for APP in web mobile; do
            cp -r "apps/$APP/.next/static" "apps/$APP/.next/standalone/apps/$APP/.next/static"
            cp -r "apps/$APP/public" "apps/$APP/.next/standalone/apps/$APP/public"
            tar -C "apps/$APP/.next/standalone" -czf "$APP.tar.gz" .
          done

      # appspec.yml이 zip 루트에 있어야 에이전트가 찾는다. 디렉터리를 통째로 zip하면
      # 한 겹 싸이므로 bundle/ 안으로 들어가서 zip한다. 훅 스크립트 경로는 appspec의
      # location(scripts/deploy/*.sh)과 맞춘다. release.sh는 v1 전용이라 담지 않는다.
      - name: Assemble bundle
        run: |
          mkdir -p bundle/scripts/deploy
          cp appspec.yml bundle/
          cp scripts/deploy/application_stop.sh \
             scripts/deploy/before_install.sh \
             scripts/deploy/after_install.sh \
             scripts/deploy/application_start.sh \
             scripts/deploy/validate_service.sh \
             bundle/scripts/deploy/
          cp web.tar.gz mobile.tar.gz bundle/
          (cd bundle && zip -r ../bundle.zip .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload bundle
        env:
          SHA: ${{ github.sha }}
        run: aws s3 cp bundle.zip "s3://$DEPLOY_BUCKET/$DEPLOY_PREFIX/$SHA/bundle.zip"

      # 정적 자산을 CloudFront 오리진용 S3에 올린다(KAN-373, deploy-v3-cdn.md §7).
      # 배포 생성보다 앞에 둔다. CodeDeploy가 트래픽을 신세대로 넘기는 순간부터
      # 신세대 HTML이 나가는데, 그 HTML이 참조하는 청크가 아직 S3에 없으면 그 구간이
      # 통째로 404다.
      #
      # ⚠️ --delete를 붙이지 않는다. 구세대 청크가 버킷에 남아 있는 것이 이 작업 전체의
      # 목적이다. 붙이는 순간 v2와 똑같은 세대 간 404가 CloudFront 뒤에서 재현된다.
      # ⚠️ Cache-Control을 직접 지정한다. Next 서버는 .next/static 응답에 immutable을
      # 자기가 붙여 주지만 S3는 아무것도 안 붙인다. 파일명이 콘텐츠 해시라 1년 불변이 맞고,
      # 같은 이유로 무효화(create-invalidation)도 필요 없다.
      - name: Upload static assets
        run: |
          for APP in web mobile; do
            aws s3 sync "apps/$APP/.next/static" "s3://$STATIC_BUCKET/$APP/_next/static" \
              --cache-control "public,max-age=31536000,immutable"
          done

      # wait deployment-successful은 15초 간격으로 최대 30분까지 기다리고,
      # 배포가 실패로 끝나면 non-zero로 빠져 잡이 빨간불이 된다.
      # ValidateService까지 실패하면 트래픽은 Blue에 남으므로 별도 롤백이 없다.
      - name: Create deployment
        id: create-deployment
        env:
          SHA: ${{ github.sha }}
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --s3-location "bucket=$DEPLOY_BUCKET,key=$DEPLOY_PREFIX/$SHA/bundle.zip,bundleType=zip" \
            --description "deploy $SHA" \
            --query deploymentId --output text)
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "배포 생성: $DEPLOYMENT_ID"
          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"
          echo "배포 성공: $DEPLOYMENT_ID"

      # 훅 스크립트 stdout은 러너로 안 온다. 어느 훅에서 죽었는지는 여기 요약으로 보고,
      # 상세 로그는 CodeDeploy 콘솔의 배포 상세 → 이벤트에서 본다.
      - name: Deployment failure info
        if: failure() && steps.create-deployment.outputs.deployment_id != ''
        run: |
          aws deploy get-deployment \
            --deployment-id "${{ steps.create-deployment.outputs.deployment_id }}" \
            --query 'deploymentInfo.{status:status,errorInformation:errorInformation,overview:deploymentOverview}'

      - name: 배포 확인
        run: echo "$WEB_SITE_URL · $MOBILE_SITE_URL 로 서비스된다"
