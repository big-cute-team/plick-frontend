name: Deploy

# main은 릴리스 브랜치다. develop에서 main으로 병합되는 순간이 배포 시점이다.
# workflow_dispatch는 코드 변경 없이 다시 돌려야 할 때 쓴다. API_BASE_URL은
# 빌드 때 산출물에 박히는 값이라, BE 주소가 바뀌면 시크릿만 고치고 여기서 재실행한다.
#
# v2(KAN-344): SSM Run Command 대신 CodeDeploy Blue/Green으로 나간다.
# 두 앱을 bundle.zip 하나로 묶어 배포 1건을 만든다. 인스턴스가 통째로 교체되는
# 구조라 앱별로 따로 배포하면 한 ASG를 두 배포가 서로 복제·종료하며 싸우기 때문이다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포는 중간에 끊기면 어중간한 상태로 남는다. 새 실행이 와도 취소하지 않고 줄 세운다.
concurrency:
  group: deploy
  cancel-in-progress: false

# OIDC로 AWS 롤을 빌려 S3 업로드와 CodeDeploy 배포 생성을 한다.
# id-token: write가 OIDC 토큰 발급 권한이다. 이게 없으면 configure-aws-credentials가 실패한다.
permissions:
  id-token: write
  contents: read

# 버킷은 BE와 같이 쓰는 plick-deploy다. 프론트 몫 접두사가 frontend/이고
# 키는 frontend/<커밋sha>/bundle.zip 하나다. CodeDeploy 앱·그룹 이름은 리포 하나에
# 배포 대상 하나라 변수로 빼지 않고 여기 상수로 둔다.
env:
  AWS_REGION: ap-northeast-2
  DEPLOY_BUCKET: plick-deploy
  DEPLOY_PREFIX: frontend
  CODEDEPLOY_APP: plick-frontend
  CODEDEPLOY_GROUP: plick-frontend-dg

jobs:
  deploy:
    name: Deploy bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 러너(ubuntu x86_64)에서 빌드해야 한다. 산출물에는 sharp 같은 플랫폼 종속
      # 네이티브 바이너리가 딸려 들어가서, 맥에서 빌드한 걸 올리면 EC2에서 깨진다.
      # Launch Template AMI도 같은 이유로 x86_64에 맞춰져 있다.
      # NEXT_PUBLIC_SITE_URL은 canonical·sitemap용 대표 URL이라 앱마다 다르고(KAN-346),
      # 비밀이 아닌 공개 도메인이라 시크릿 대신 여기 상수로 박는다. 값이 틀리면
      # canonical과 sitemap이 통째로 엉뚱한 도메인을 가리키므로 수정 시 재확인한다.
      # 교차 URL(web의 MOBILE_SITE_URL, mobile의 WEB_SITE_URL)은 m-dot 상호 선언용
      # (모바일 canonical → 데스크톱, 데스크톱 alternate → 모바일)이라 같은 이유로 상수다.
      - name: Build web
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: https://plick.co.kr
          NEXT_PUBLIC_MOBILE_SITE_URL: https://m.plick.co.kr
        run: pnpm --filter web build

      - name: Build mobile
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: https://m.plick.co.kr
          NEXT_PUBLIC_WEB_SITE_URL: https://plick.co.kr
        run: pnpm --filter mobile build

      # standalone은 public/과 .next/static/을 담지 않는다(CDN 배포 전제).
      # 한 서버에서 다 서빙하므로 여기서 채워 넣는다. 빠뜨리면 CSS·이미지가 404다.
      - name: Assemble standalone
        run: |
          for APP in web mobile; do
            cp -r "apps/$APP/.next/static" "apps/$APP/.next/standalone/apps/$APP/.next/static"
            cp -r "apps/$APP/public" "apps/$APP/.next/standalone/apps/$APP/public"
            tar -C "apps/$APP/.next/standalone" -czf "$APP.tar.gz" .
          done

      # appspec.yml이 zip 루트에 있어야 에이전트가 찾는다. 디렉터리를 통째로 zip하면
      # 한 겹 싸이므로 bundle/ 안으로 들어가서 zip한다. 훅 스크립트 경로는 appspec의
      # location(scripts/deploy/*.sh)과 맞춘다. release.sh는 v1 전용이라 담지 않는다.
      - name: Assemble bundle
        run: |
          mkdir -p bundle/scripts/deploy
          cp appspec.yml bundle/
          cp scripts/deploy/application_stop.sh \
             scripts/deploy/before_install.sh \
             scripts/deploy/after_install.sh \
             scripts/deploy/application_start.sh \
             scripts/deploy/validate_service.sh \
             bundle/scripts/deploy/
          cp web.tar.gz mobile.tar.gz bundle/
          (cd bundle && zip -r ../bundle.zip .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload bundle
        env:
          SHA: ${{ github.sha }}
        run: aws s3 cp bundle.zip "s3://$DEPLOY_BUCKET/$DEPLOY_PREFIX/$SHA/bundle.zip"

      # wait deployment-successful은 15초 간격으로 최대 30분까지 기다리고,
      # 배포가 실패로 끝나면 non-zero로 빠져 잡이 빨간불이 된다.
      # ValidateService까지 실패하면 트래픽은 Blue에 남으므로 별도 롤백이 없다.
      - name: Create deployment
        id: create-deployment
        env:
          SHA: ${{ github.sha }}
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --s3-location "bucket=$DEPLOY_BUCKET,key=$DEPLOY_PREFIX/$SHA/bundle.zip,bundleType=zip" \
            --description "deploy $SHA" \
            --query deploymentId --output text)
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "배포 생성: $DEPLOYMENT_ID"
          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"
          echo "배포 성공: $DEPLOYMENT_ID"

      # 훅 스크립트 stdout은 러너로 안 온다. 어느 훅에서 죽었는지는 여기 요약으로 보고,
      # 상세 로그는 CodeDeploy 콘솔의 배포 상세 → 이벤트에서 본다.
      - name: Deployment failure info
        if: failure() && steps.create-deployment.outputs.deployment_id != ''
        run: |
          aws deploy get-deployment \
            --deployment-id "${{ steps.create-deployment.outputs.deployment_id }}" \
            --query 'deploymentInfo.{status:status,errorInformation:errorInformation,overview:deploymentOverview}'

      - name: 배포 확인
        run: echo "https://plick.co.kr · https://m.plick.co.kr 로 서비스된다"
