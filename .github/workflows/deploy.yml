name: Deploy

# main은 릴리스 브랜치다. develop에서 main으로 병합되는 순간이 배포 시점이다.
# workflow_dispatch는 코드 변경 없이 다시 돌려야 할 때 쓴다. API_BASE_URL은
# 빌드 때 산출물에 박히는 값이라, BE 주소가 바뀌면 시크릿만 고치고 여기서 재실행한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포는 중간에 끊기면 서버가 어중간한 상태로 남는다. 새 실행이 와도 취소하지 않고 줄 세운다.
concurrency:
  group: deploy
  cancel-in-progress: false

# EC2가 프라이빗 서브넷에 있어 러너에서 SSH가 닿지 않는다. OIDC로 AWS 롤을 빌려
# S3에 산출물을 올리고 SSM Run Command로 서버 쪽 릴리스 스크립트를 실행한다.
# id-token: write가 OIDC 토큰 발급 권한이다. 이게 없으면 configure-aws-credentials가 실패한다.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  DEPLOY_BUCKET: plick-deploy-artifacts

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      # 두 앱이 같은 인스턴스에 뜨지만 디렉터리도 pm2 프로세스도 따로라 동시에 나가도 된다.
      # 한쪽이 실패해도 다른 쪽은 자기 롤백을 마치게 fail-fast를 끈다.
      fail-fast: false
      matrix:
        include:
          - app: web
            domain: plick.co.kr
          - app: mobile
            domain: m.plick.co.kr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 러너(ubuntu x86_64)에서 빌드해야 한다. 산출물에는 sharp 같은 플랫폼 종속
      # 네이티브 바이너리가 딸려 들어가서, 맥에서 빌드한 걸 올리면 EC2에서 깨진다.
      - name: Build
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: pnpm --filter ${{ matrix.app }} build

      # standalone은 public/과 .next/static/을 담지 않는다(CDN 배포 전제).
      # 한 서버에서 다 서빙하므로 여기서 채워 넣는다. 빠뜨리면 CSS·이미지가 404다.
      - name: Assemble standalone
        env:
          APP: ${{ matrix.app }}
        run: |
          cp -r "apps/$APP/.next/static" "apps/$APP/.next/standalone/apps/$APP/.next/static"
          cp -r "apps/$APP/public" "apps/$APP/.next/standalone/apps/$APP/public"
          tar -C "apps/$APP/.next/standalone" -czf "$APP.tar.gz" .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 릴리스 스크립트도 같이 올린다. EC2에 스크립트를 미리 둘 필요가 없고,
      # 항상 이 커밋의 스크립트가 실행되므로 코드와 스크립트 버전이 어긋나지 않는다.
      - name: Upload artifact
        env:
          APP: ${{ matrix.app }}
          SHA: ${{ github.sha }}
        run: |
          aws s3 cp "$APP.tar.gz" "s3://$DEPLOY_BUCKET/deploy/$SHA/$APP.tar.gz"
          aws s3 cp scripts/deploy/release.sh "s3://$DEPLOY_BUCKET/deploy/$SHA/release.sh"

      # 릴리스 교체·기동·헬스체크·롤백은 서버 쪽 스크립트(release.sh)가 맡는다.
      #
      # SSM Run Command는 root로 실행되는데 pm2 데몬과 /srv 디렉터리는 ubuntu 소유라
      # sudo -u ubuntu로 내려서 돌린다. -H가 HOME을 /home/ubuntu로 잡아 줘야
      # pm2가 자기 데몬(~/.pm2)을 제대로 찾는다.
      #
      # AWS-RunShellScript는 commands를 셸 스크립트 하나로 이어 붙여 실행하고
      # 종료 코드는 마지막 명령 것만 본다. set -e를 첫 줄에 두지 않으면 중간 실패가
      # 묻히므로 반드시 유지한다.
      #
      # send-command는 비동기다. get-command-invocation으로 끝날 때까지 폴링하고
      # 서버 로그를 그대로 받아와, 헬스체크 실패 롤백까지 여기 빨간불로 잇는다.
      - name: Release
        env:
          APP: ${{ matrix.app }}
          SHA: ${{ github.sha }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          # executionTimeout은 서버에서 명령이 매달렸을 때 SSM 에이전트가 끊는 시한이다.
          # 릴리스는 flock 대기를 포함해도 1~2분이면 끝난다. 아래 폴링 한도(450초)보다
          # 짧아야 hang이 폴링 시간 안에 실패로 확정된다.
          cat > ssm-params.json <<EOF
          {
            "commands": [
              "set -e",
              "aws s3 cp s3://$DEPLOY_BUCKET/deploy/$SHA/release.sh /tmp/plick-release-$APP.sh",
              "sudo -u ubuntu -H env APP=$APP SHA=$SHA BUCKET=$DEPLOY_BUCKET bash /tmp/plick-release-$APP.sh"
            ],
            "executionTimeout": ["420"]
          }
          EOF

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy $APP $SHA" \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' --output text)

          STATUS=InProgress
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          echo "--- 서버 로그 ---"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text

          if [ "$STATUS" != "Success" ]; then
            echo "--- 서버 stderr ---"
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text
            echo "SSM 명령 상태: $STATUS"
            exit 1
          fi

      - name: 배포 확인
        run: echo "https://${{ matrix.domain }} 로 서비스된다"
