name: Deploy

# main은 릴리스 브랜치다. develop에서 main으로 병합되는 순간이 배포 시점이다.
# workflow_dispatch는 코드 변경 없이 다시 돌려야 할 때 쓴다. API_BASE_URL은
# 빌드 때 산출물에 박히는 값이라, BE 주소가 바뀌면 시크릿만 고치고 여기서 재실행한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포는 중간에 끊기면 서버가 어중간한 상태로 남는다. 새 실행이 와도 취소하지 않고 줄 세운다.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      # 두 앱이 같은 인스턴스에 뜨지만 디렉터리도 pm2 프로세스도 따로라 동시에 나가도 된다.
      # 한쪽이 실패해도 다른 쪽은 자기 롤백을 마치게 fail-fast를 끈다.
      fail-fast: false
      matrix:
        include:
          - app: web
            domain: plick.co.kr
          - app: mobile
            domain: m.plick.co.kr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 러너(ubuntu x86_64)에서 빌드해야 한다. 산출물에는 sharp 같은 플랫폼 종속
      # 네이티브 바이너리가 딸려 들어가서, 맥에서 빌드한 걸 올리면 EC2에서 깨진다.
      - name: Build
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: pnpm --filter ${{ matrix.app }} build

      # standalone은 public/과 .next/static/을 담지 않는다(CDN 배포 전제).
      # 한 서버에서 다 서빙하므로 여기서 채워 넣는다. 빠뜨리면 CSS·이미지가 404다.
      - name: Assemble standalone
        env:
          APP: ${{ matrix.app }}
        run: |
          cp -r "apps/$APP/.next/static" "apps/$APP/.next/standalone/apps/$APP/.next/static"
          cp -r "apps/$APP/public" "apps/$APP/.next/standalone/apps/$APP/public"
          tar -C "apps/$APP/.next/standalone" -czf "$APP.tar.gz" .

      - name: Prepare SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload artifact
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          APP: ${{ matrix.app }}
        run: scp -i ~/.ssh/deploy.pem "$APP.tar.gz" "ubuntu@$EC2_HOST:/tmp/$APP-${{ github.sha }}.tar.gz"

      # 릴리스 교체·기동·헬스체크·롤백은 서버 쪽 스크립트가 맡는다.
      # 표준입력으로 흘려보내므로 EC2에 스크립트를 미리 둘 필요가 없다.
      - name: Release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: ssh -i ~/.ssh/deploy.pem "ubuntu@$EC2_HOST" "APP=${{ matrix.app }} SHA=${{ github.sha }} bash -s" < scripts/deploy/release.sh

      - name: 배포 확인
        run: echo "https://${{ matrix.domain }} 로 서비스된다"
